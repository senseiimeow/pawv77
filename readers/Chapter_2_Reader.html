  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:#0a0710;color:var(--cream);font-family:var(--sans);line-height:1.65;overflow-x:hidden;

  mix-blend-mode:overlay}
#rp{position:fixed;top:0;left:0;height:2px;width:0;background:var(--grad);z-index:60;
  box-shadow:0 0 14px rgba(255,140,110,.8);transition:width .1s linear}
.topbar{position:fixed;top:0;left:0;right:0;z-index:55;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:10px 16px;

.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:13px;
  letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.tinfo{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);
  text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnav{display:flex;gap:6px;flex:none}
.tbtn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:9px 13px;border-radius:999px;

  min-height:40px;display:inline-flex;align-items:center}
.tbtn:hover,.tbtn:active{border-color:rgba(255,178,94,.7);color:#fff}
header.chead{text-align:center;padding:108px 18px 24px;
  background:radial-gradient(90% 80% at 50% -10%,rgba(140,47,57,.35),transparent 65%)}

  margin:12px 0 0;color:#fff;line-height:1.12}

  -webkit-text-fill-color:transparent}
.jp{color:var(--sakura);font-size:11px;letter-spacing:.36em;margin-top:12px;opacity:.8}
.meta{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#7a6f8c;margin-top:14px}
.bar{width:52px;height:3px;background:var(--grad);margin:20px auto 0;border-radius:3px}
main{max-width:860px;margin:0 auto;padding:22px 10px 16px}
figure.pg{margin:0 0 22px;position:relative;border-radius:12px;overflow:hidden;

figure.pg img{width:100%;height:auto;display:block;opacity:0;transition:opacity .6s ease}
figure.pg img.ld{opacity:1}

  padding:10px 0 8px;text-transform:uppercase}
.endcard{margin:30px auto 0;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:22px;

.endcard .k{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:var(--coral)}
.endcard h3{font-family:var(--serif);font-size:clamp(20px,5vw,34px);font-weight:400;margin:12px 0 8px;line-height:1.15}
.endcard p{color:var(--mute);font-size:13px;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 24px;border-radius:999px;

  background:var(--grad);color:#1a0d10;box-shadow:0 14px 40px -16px rgba(255,110,100,.9);transition:.35s;
  min-height:46px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(255,255,255,.18);box-shadow:none}
footer.rfoot{text-align:center;padding:50px 20px 70px;font-size:9px;letter-spacing:.28em;

.pager{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#top{position:fixed;right:14px;bottom:18px;z-index:56;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:rgba(23,17,32,.9);border:1px solid rgba(255,255,255,.18);
  color:#fff;font-size:15px;backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.35s}
#top.on{opacity:1;pointer-events:auto}
@media(max-width:600px){
  .tinfo{display:none}
  .topbar{padding:9px 12px}

/* =========================================================
   PAWGRAM v3 · READER LAYER (inlined into each chapter file)
   Additive only — it never changes the page art or the layout
   of the manhwa pages themselves.
   ========================================================= */

/* coral-thread progress + paw handle */
#rp{
  background:linear-gradient(90deg,#ff5f7e,#ffb25e,#ffd166,#7ef0d0,#b9a7ff)!important;
  background-size:300% 100%!important;animation:rpSlide 6s linear infinite;
  box-shadow:0 0 18px rgba(255,120,140,.85)!important;height:3px!important;
}
@keyframes rpSlide{to{background-position:300% 0}}
#rpPaw{
  position:fixed;top:1.5px;left:0;z-index:61;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,#ffd9e2 60%,#ffb7c5);
  box-shadow:0 6px 14px -4px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.4);
  pointer-events:none;transition:left .06s linear;
}
#rpPaw::after{
  content:"🐾";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;
}

/* extra chrome buttons in the top bar */
.uibtn{
  width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.04);color:var(--cream);display:inline-grid;place-items:center;
  font-size:15px;transition:.3s;flex:none;
}
.uibtn:hover{border-color:rgba(255,178,94,.7);color:#fff;transform:translateY(-1px)}
.topbar.faded{opacity:0;transform:translateY(-100%);pointer-events:none}
.topbar{transition:opacity .35s ease,transform .4s cubic-bezier(.19,1,.22,1)}

/* "continue where you left off" */
.resume{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:62;
  transform:translate(-50%,140%);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 15px;
  border-radius:999px;background:rgba(23,17,32,.94);border:1px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11.5px;letter-spacing:.06em;
  color:#f8eee4;box-shadow:0 20px 40px -22px #000;
  transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .4s;opacity:0;max-width:calc(100% - 24px);
}
.resume.on{transform:translate(-50%,0);opacity:1}
.resume .rb{border-radius:999px;padding:7px 13px;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;border:1px solid rgba(255,255,255,.2);color:#fff;flex:none}
.resume .rb.go{background:linear-gradient(100deg,#ff5f7e,#ffb25e);color:#2a0d14;border:0;font-weight:700}
.resume .rb.x{border:0;opacity:.6;padding:6px 8px}

/* panel entrance — opacity only, never touches layout */
figure.pg.pg-anim{opacity:.001;transform:translateY(14px);
  transition:opacity .75s cubic-bezier(.19,1,.22,1),transform .8s cubic-bezier(.19,1,.22,1)}
figure.pg.pg-anim.seen{opacity:1;transform:none}

/* reactions at the end */
.rreact{margin-top:22px;display:grid;gap:10px;justify-items:center}
.rr-label{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#7a6f8c}
.rr-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rr-row button{
  min-width:52px;padding:10px 14px;border-radius:999px;font-size:15px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s;
}
.rr-row button:hover{transform:translateY(-3px) scale(1.06);background:rgba(255,255,255,.14)}
.rr-row button.picked{background:#ffb7c5;color:#2a0d14;border-color:transparent}

/* floating emoji (reactions) */
.emoji-float{position:fixed;z-index:99;font-size:24px;pointer-events:none;
  animation:emojiUp2 1.5s cubic-bezier(.19,1,.22,1) forwards}
@keyframes emojiUp2{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  20%{opacity:1;transform:translateY(-18px) scale(1.15)}
  100%{opacity:0;transform:translateY(-110px) scale(.9) rotate(14deg)}
}

/* day reading mode */
html[data-theme="day"] body{background:#fdf4ec!important;color:#2c1626}
html[data-theme="day"] figure.pg{box-shadow:0 18px 40px -30px rgba(120,60,80,.5),0 0 0 1px rgba(120,60,80,.12)}
html[data-theme="day"] .topbar{background:rgba(255,248,242,.9)!important;border-bottom-color:rgba(140,47,57,.14)}
html[data-theme="day"] .brand,html[data-theme="day"] .tinfo{color:#2c1626!important}
html[data-theme="day"] h1,html[data-theme="day"] .endcard h3{color:#2c1626}
html[data-theme="day"] .endcard p{color:#6b4a5c}
html[data-theme="day"] .uibtn,html[data-theme="day"] .tbtn{color:#2c1626!important;
  border-color:rgba(120,60,80,.28)!important}

@media(prefers-reduced-motion:reduce){
  figure.pg.pg-anim{opacity:1;transform:none;transition:none}
  #rp{animation:none}
}

(function(){
  var bar=document.getElementById('rp'), top=document.getElementById('top');
  var doc=document.documentElement, raf=null;
  function upd(){
    var y=doc.scrollTop, max=doc.scrollHeight-doc.clientHeight||1;
    bar.style.width=(y/max*100).toFixed(1)+'%';
    top.classList.toggle('on', y>700);
    raf=null;
  }
  addEventListener('scroll',function(){ if(!raf) raf=requestAnimationFrame(upd); },{passive:true});
  top.addEventListener('click',function(e){e.preventDefault();scrollTo({top:0,behavior:'smooth'});});
  /* fade-in each page as it loads */
  document.querySelectorAll('figure.pg img').forEach(function(im){
    if(im.complete) im.classList.add('ld');
    else im.addEventListener('load',function(){im.classList.add('ld');});
  });
  /* next-chapter prefetch when the reader reaches the end */
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      var l=document.createElement('link'); l.rel='prefetch'; l.as='document';
      l.href=('Chapter_3_Reader.html');
      if(l.href && !document.querySelector('link[href="'+l.href+'"]')) document.head.appendChild(l);
      io.disconnect();
    });
  },{rootMargin:'900px'});
  var ec=document.querySelector('.endcard'); if(ec) io.observe(ec);
})();

<script>
/* =========================================================
   PAWGRAM v3 · READER  (injected into every Chapter reader)
   - coral-thread progress bar with paw handle
   - site chrome: day/night, hide-ui (tap to hide), share
   - per-chapter progress + scroll position saved locally
   - "continue where you left off" restore
   - panel entrance animation (cheap, never hurts readability)
   - reactions at the end of the chapter
   Readability rules: no motion on the artwork itself, no
   layout shift, no animation while scrolling fast.
   ========================================================= */
(function (w, d) {
  'use strict';
  var CHAPTER = parseInt((d.body && d.body.dataset.chapter) || '1', 10);
  var KEY = 'pg-pos-' + CHAPTER, PKEY = 'pg-progress';

  /* ---------- storage with a memory fallback ---------- */
  var mem = {};
  function get(k) { try { var v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : null; }
  function set(k, v) { mem[k] = String(v); try { localStorage.setItem(k, v); } catch (e) {} }

  var reduce = (w.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || get('pg-rm') === '1';

  /* ---------- progress bar (coral thread + paw handle) ---------- */
  var bar = d.getElementById('rp');
  var paw = d.createElement('div');
  paw.id = 'rpPaw';
  paw.setAttribute('aria-hidden', 'true');
  d.body.appendChild(paw);

  var doc = d.documentElement, ticking = false, lastPct = -1;
  function onScroll() {
    ticking = false;
    var h = doc.scrollHeight - w.innerHeight;
    var pct = h > 0 ? Math.min(100, Math.max(0, (w.scrollY / h) * 100)) : 0;
    if (bar) bar.style.width = pct.toFixed(2) + '%';
    paw.style.left = pct.toFixed(2) + '%';
    paw.style.transform = 'translate(-50%,-50%) rotate(' + (pct * 3.6).toFixed(0) + 'deg)';
    if (Math.abs(pct - lastPct) > 1.2) {
      lastPct = pct;
      saveProgress(pct);
    }
    /* back-to-top visibility */
    var top = d.getElementById('top');
    if (top) top.classList.toggle('on', w.scrollY > w.innerHeight * 1.2);
  }
  function saveProgress(pct) {
    set(KEY, Math.round(w.scrollY));
    var all = {};
    try { all = JSON.parse(get(PKEY) || '{}') || {}; } catch (e) { all = {}; }
    all[CHAPTER] = Math.max(all[CHAPTER] || 0, Math.round(pct));
    set(PKEY, JSON.stringify(all));
  }
  w.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    w.requestAnimationFrame(onScroll);
  }, { passive: true });

  /* ---------- resumed reading banner ---------- */
  (function resume() {
    var saved = parseInt(get(KEY) || '0', 10);
    if (!saved || saved < 400) return;
    var b = d.createElement('div');
    b.className = 'resume';
    b.innerHTML = '<span>Continue where you left off?</span><button type="button" class="rb go">Jump in</button>' +
      '<button type="button" class="rb x" aria-label="Dismiss">✕</button>';
    d.body.appendChild(b);
    setTimeout(function () { b.classList.add('on'); }, 900);
    b.querySelector('.go').addEventListener('click', function () {
      w.scrollTo({ top: saved, behavior: reduce ? 'auto' : 'smooth' });
      b.classList.remove('on');
    });
    b.querySelector('.x').addEventListener('click', function () { b.classList.remove('on'); });
    setTimeout(function () { b.classList.remove('on'); }, 12000);
  })();

  /* ---------- tap to hide the top bar ---------- */
  (function hideUI() {
    var top = d.querySelector('.topbar');
    if (!top) return;
    var hidden = false;
    var btn = d.createElement('button');
    btn.className = 'uibtn';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Hide interface');
    btn.textContent = '⤢';
    var tools = d.querySelector('.tnav');
    if (tools) tools.appendChild(btn);
    function toggle() {
      hidden = !hidden;
      top.classList.toggle('faded', hidden);
      btn.textContent = hidden ? '⤡' : '⤢';
      btn.setAttribute('aria-label', hidden ? 'Show interface' : 'Hide interface');
    }
    btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
    d.addEventListener('keydown', function (e) {
      if (e.key === 'h' || e.key === 'H') toggle();
    });
  })();

  /* ---------- day / night in the reader ---------- */
  (function theme() {
    var tools = d.querySelector('.tnav');
    if (!tools) return;
    var b = d.createElement('button');
    b.className = 'uibtn';
    b.type = 'button';
    b.setAttribute('aria-label', 'Toggle day or night reading');
    b.textContent = get('pg-theme') === 'day' ? '☾' : '☀';
    if (get('pg-theme') === 'day') d.documentElement.setAttribute('data-theme', 'day');
    b.addEventListener('click', function () {
      var day = d.documentElement.getAttribute('data-theme') === 'day';
      d.documentElement.setAttribute('data-theme', day ? 'night' : 'day');
      set('pg-theme', day ? 'night' : 'day');
      b.textContent = day ? '☀' : '☾';
      var meta = d.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', day ? '#0a0710' : '#fdf4ec');
    });
    tools.insertBefore(b, tools.firstChild);
  })();

  /* ---------- page entrance (opacity only, IO gated) ---------- */
  if (!reduce && 'IntersectionObserver' in w) {
    var figs = Array.prototype.slice.call(d.querySelectorAll('figure.pg'));
    figs.forEach(function (f) { f.classList.add('pg-anim'); });
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('seen');
        io.unobserve(e.target);
      });
    }, { threshold: 0.02, rootMargin: '200px 0px' });
    figs.forEach(function (f) { io.observe(f); });
  }

  /* ---------- image fade-in (keeps the LQIP visible until loaded) ---------- */
  Array.prototype.forEach.call(d.querySelectorAll('figure.pg img'), function (im) {
    if (im.complete && im.naturalWidth) { im.classList.add('ld'); return; }
    im.addEventListener('load', function () { im.classList.add('ld'); });
    im.addEventListener('error', function () { im.classList.add('ld'); });
  });

  /* ---------- reactions at the end ---------- */
  (function reactions() {
    var end = d.querySelector('.endcard');
    if (!end) return;
    var EMO = ['❤️', '🥹', '🌸', '😭', '🐾'];
    var row = d.createElement('div');
    row.className = 'rreact';
    row.innerHTML = '<div class="rr-label">react to this chapter</div>' +
      '<div class="rr-row">' + EMO.map(function (e) {
        return '<button type="button" data-emo="' + e + '">' + e + '</button>';
      }).join('') + '</div>';
    end.appendChild(row);
    var counts = {};
    try { counts = JSON.parse(get('pg-reactions') || '{}') || {}; } catch (e) { counts = {}; }
    row.addEventListener('click', function (e) {
      var b = e.target.closest('[data-emo]');
      if (!b) return;
      var em = b.dataset.emo, k = 'rch' + CHAPTER + '-' + em;
      counts[k] = (counts[k] || 0) + 1;
      set('pg-reactions', JSON.stringify(counts));
      b.classList.add('picked');
      b.innerHTML = em + ' ' + counts[k];
      var r = b.getBoundingClientRect();
      var f = d.createElement('div');
      f.className = 'emoji-float';
      f.textContent = em;
      f.style.left = (r.left + r.width / 2) + 'px';
      f.style.top = (r.top - 6) + 'px';
      d.body.appendChild(f);
      setTimeout(function () { f.remove(); }, 1500);
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
    });
  })();

  /* ---------- mark that chapter 1 was opened ---------- */
  if (CHAPTER === 1) set('pg-seen-1', '1');

  onScroll();
})(window, document);

</script>
</body></html>
